</style></head><body><div id="root"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const routes={balanced:[[19.076,72.8777],[19.082,72.889],[19.087,72.899],[19.095,72.908],[19.103,72.918],[19.112,72.927],[19.119,72.937]],fastest:[[19.076,72.8777],[19.082,72.886],[19.088,72.894],[19.098,72.901],[19.106,72.910],[19.115,72.922],[19.119,72.937]],lowrisk:[[19.076,72.8777],[19.068,72.888],[19.072,72.901],[19.083,72.912],[19.096,72.922],[19.108,72.931],[19.119,72.937]]};
const colors={balanced:'#7c5cff',fastest:'#f6b73c',lowrisk:'#35d07f'};let hour=22,selected='balanced',alert=false;
const segs=[['s1',19.083,72.889,20,88,74,1,89],['s2',19.087,72.899,43,61,49,3,77],['s3',19.095,72.908,68,42,31,5,84],['s4',19.103,72.918,31,76,63,1,82],['s5',19.112,72.927,55,53,40,2,74],['s6',19.119,72.937,18,91,82,0,93]];
function risk(s){let base=s[3];if(hour<20)base=Math.round(base*.65);else if(hour<22)base=Math.round(base*.8);else if(hour===22)base=Math.round(base*1.05);else base=Math.round(base*1.18);if(alert&&s[0]==='s3')base+=18;return Math.min(95,base)}
function cls(r){return r>=60?'danger':r>=35?'warning':'safe'}
function render(){document.body.innerHTML=`<div class="app-shell"><header class="topbar"><div class="brand"><div class="brand-mark">🛡</div><div><div class="brand-name">SafeRoute</div><div class="brand-sub">by Team Trishul · CX1002</div></div></div><div class="top-actions"><div class="live-pill"><span class="live-dot"></span> LIVE SAFETY LAYER</div><button class="icon-btn">🔒</button><button class="avatar">SP</button></div></header><main class="workspace"><aside class="sidebar"><section class="trip-card glass"><div class="eyebrow">JOURNEY PLANNER</div><div class="field">📍<div><span>From</span><strong>Current location</strong></div></div><div class="connector"></div><div class="field">🏁<div><span>To</span><strong>Home / Destination</strong></div></div><div class="time-row"><div class="field compact">🕒<div><span>Depart</span><strong>${String(hour).padStart(2,'0')}:00</strong></div></div><button class="change-time" id="change">Change</button></div><button class="primary-btn" id="analyze">🧭 Analyze safer routes</button></section><section class="mode-card glass"><div class="section-title">Route preference</div><div class="mode-grid">${[['fastest','Fastest','31 min'],['balanced','Balanced','34 min'],['lowrisk','Lowest Risk','39 min']].map(x=>`<button class="mode ${selected===x[0]?'active':''}" data-route="${x[0]}"><b>${x[1]}</b><span>${x[2]}</span></button>`).join('')}</div></section><section class="insight-card glass"><div class="section-title">⏱ Time-aware insight</div><div class="big-insight">${hour>=22?'Risk rises after 10 PM':'Conditions are relatively stable'}</div><p>Every segment is evaluated at the time you are expected to reach it.</p><div class="mini-stat"><span>Weakest segment</span><b>${[...segs].sort((a,b)=>risk(b)-risk(a))[0][0].toUpperCase()} · ${risk([...segs].sort((a,b)=>risk(b)-risk(a))[0])}/100</b></div></section><section class="report-card glass"><div class="section-title">📡 Community layer</div><div class="report-stats"><div><b>7</b><span>active reports</span></div><div><b>88%</b><span>evidence confidence</span></div></div><button class="secondary-btn" id="report">⚠ Report a condition</button></section><div class="guardrail">✓ No route is labelled 100% safe. Missing evidence stays unknown.</div></aside><section class="map-area"><div id="map" class="map"></div><div class="map-top-controls"><div class="search-chip">📍 Pilot journey · Mumbai demo area</div><button class="map-control" id="recalc">↻ Recalculate</button></div><div class="risk-legend glass"><span><i class="dot safe"></i>Low</span><span><i class="dot warning"></i>Moderate</span><span><i class="dot danger"></i>High</span></div><div class="route-panel glass"><div class="route-header"><div><div class="eyebrow">RECOMMENDED ROUTES · ${String(hour).padStart(2,'0')}:00</div><h2>Choose with context, not a blind score.</h2></div></div><div class="route-list">${[['balanced','Balanced',34,28],['fastest','Fastest',31,hour>=22?81:61],['lowrisk','Lowest Risk',39,18]].map(x=>`<button class="route-item ${selected===x[0]?'selected':''}" data-route="${x[0]}"><div class="route-color" style="background:${colors[x[0]]}"></div><div class="route-main"><div class="route-name"><b>${x[1]}</b>${x[0]==='balanced'?'<span class="recommended">RECOMMENDED</span>':''}</div><div class="route-note">${x[0]==='fastest'?'Fastest, but crosses a low-visibility segment after 10:45 PM.':x[0]==='balanced'?'Adds 3 min to avoid a high-risk late-night segment.':'Lowest observed risk with stronger lighting and more public activity.'}</div></div><div class="route-metrics"><b>${x[2]} min</b><span class="${cls(x[3])}">${x[3]>=60?'High':x[3]>=35?'Moderate':'Low'} · ${x[3]}</span></div>›</button>`).join('')}</div></div></section><aside class="evidence-panel"><section class="evidence-card glass"><div class="evidence-title"><div><div class="eyebrow">WHY THIS ROUTE?</div><h2>${selected==='lowrisk'?'Lowest Risk':selected==='fastest'?'Fastest':'Balanced'} route</h2></div><span class="confidence high">88% confidence</span></div><div class="evidence-summary">This recommendation weighs lighting, activity, recent reports, freshness and distance to help at the expected arrival time.</div><div class="reason-grid"><div>💡<span><b>Lighting</b>Strong on 72% of route</span></div><div>👥<span><b>Activity</b>Moderate-to-high after 9 PM</span></div><div>⚠<span><b>Reports</b>Fresh reports weighted by evidence</span></div><div>🧭<span><b>Safe points</b>3 verified public points nearby</span></div></div></section><section class="segment-card glass"><div class="section-title">⚠ Weak points</div>${[...segs].sort((a,b)=>risk(b)-risk(a)).slice(0,3).map(s=>`<div class="segment-row"><div class="risk-bar ${cls(risk(s))}"><span style="width:${risk(s)}%"></span></div><div><b>${s[0].toUpperCase()}</b><span>${risk(s)>=60?'Recent reports + weak lighting':'Sparse activity late night'}</span></div><strong>${risk(s)}</strong></div>`).join('')}</section><section class="whatif-card glass"><div class="section-title">🕒 What-if: departure time</div><input id="slider" type="range" min="18" max="23" value="${hour}"><div class="slider-labels"><span>6 PM</span><b>${String(hour).padStart(2,'0')}:00</b><span>11 PM</span></div><p>Move the clock and watch segment risk + route ordering change.</p></section><section class="live-card glass"><div class="live-head"><div><div class="eyebrow">LIVE SAFETY LAYER</div><h3>${alert?'Condition changed':'Monitoring journey context'}</h3></div><span class="pulse"><span></span></span></div>${alert?'<div class="alert-box"><b>⚠ New report changed S3</b><span>Confidence 91% · Freshness 4 min</span><span>Original route risk increased.</span><button class="reroute-btn" id="reroute">Show safer alternative ›</button></div>':'<p>No meaningful new condition detected.</p><button class="secondary-btn" id="live">◉ Simulate high-confidence report</button>'}</section></aside></main></div>`;
const map=L.map('map',{zoomControl:false}).setView([19.1,72.91],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors'}).addTo(map);Object.entries(routes).forEach(([k,c])=>L.polyline(c,{color:colors[k],weight:k===selected?8:4,opacity:k===selected?.95:.45,dashArray:k===selected?null:'8 10'}).addTo(map).on('click',()=>{selected=k;render()}));L.marker([19.076,72.8777]).addTo(map).bindPopup('<b>Trip start</b><br>Time-aware analysis begins here.');segs.forEach(s=>L.circleMarker([s[1],s[2]],{radius:7,color:risk(s)>=60?'#ff4d67':risk(s)>=35?'#f6b73c':'#35d07f',fillOpacity:.85,weight:3}).addTo(map).bindPopup(`<b>${s[0].toUpperCase()} · ${risk(s)>=60?'High':risk(s)>=35?'Moderate':'Low'} risk</b><br>${risk(s)}/100 at ${hour}:00<br>Lighting ${s[4]}% · Activity ${s[5]}%<br>${s[6]} reports · ${s[7]}% confidence`));
document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{selected=b.dataset.route;render()});document.getElementById('change').onclick=()=>{hour=hour>=23?18:hour+1;render()};document.getElementById('slider').oninput=e=>{hour=+e.target.value;render()};document.getElementById('live')?.addEventListener('click',()=>{alert=true;render()});document.getElementById('reroute')?.addEventListener('click',()=>{selected='lowrisk';render()});document.getElementById('report').onclick=()=>{alert('Demo report flow: in the full React build this opens the anonymous report form and feeds the evidence layer.')};}
render();</script></body></html>
